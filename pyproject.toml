[project]
name = "multi-agent-mcp-server"
version = "0.1.0"
description = "Production-grade multi-agent AI system (LangGraph supervisor + ReAct sub-agents) exposed via an MCP server and a FastAPI wrapper."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires a live external service (Ollama, Phoenix, network) — excluded from default/CI runs",
]

[tool.ruff]
line-length = 100
target-version = "py311"
